# CI/CD: mỗi lần push hoặc tạo Pull Request sẽ tự động kiểm thử và build Docker image
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-api-test:
    name: Unit & API test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  e2e-test:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    needs: unit-api-test
    env:
      PW_CHANNEL: chromium
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: app/e2e-report
          retention-days: 7

  automation-samples:
    name: Playwright mẫu (Sauce Demo)
    runs-on: ubuntu-latest
    needs: unit-api-test
    # Giá trị lấy từ Settings → Secrets and variables → Actions của repo GitHub.
    # Chưa khai báo thì dùng mặc định trong automation/test-data/accounts.js và playwright.config.js.
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      LOCKED_USERNAME: ${{ vars.LOCKED_USERNAME }}
      PW_CHANNEL: chromium
      RETRIES: 1
      WORKERS: 2
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-report
          path: automation/playwright-report
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [unit-api-test, e2e-test, automation-samples]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-testcase-manager:${{ github.sha }} .
