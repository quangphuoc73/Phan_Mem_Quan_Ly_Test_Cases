l, email, apiToken</text><text x="648" y="391.0" font-size="18" dominant-baseline="middle">-MOCK_PROJECTS (Jira giả lập)</text><text x="648" y="425.0" font-size="18" dominant-baseline="middle">+testConnection()</text><text x="648" y="451.0" font-size="18" dominant-baseline="middle">+importProject(key, userId)</text><text x="648" y="477.0" font-size="18" dominant-baseline="middle">+syncProject(projectId, userId)</text><text x="648" y="503.0" font-size="18" dominant-baseline="middle">+syncAll(userId)</text><text x="648" y="529.0" font-size="18" dominant-baseline="middle">+checkWebhookSecret(secret)</text><text x="648" y="555.0" font-size="18" dominant-baseline="middle">+handleWebhook(body)</text><text x="648" y="581.0" font-size="18" dominant-baseline="middle">-fetchProject · fetchStories · fetchSprints</text><text x="648" y="607.0" font-size="18" dominant-baseline="middle">-saveProjectMeta · saveSprints · saveStories</text><rect x="640" y="690" width="530" height="168" fill="#E3F0FF" stroke="#0052CC" stroke-width="2"/><line x1="640" y1="738" x2="1170" y2="738" stroke="#0052CC" stroke-width="1.5"/><line x1="640" y1="772" x2="1170" y2="772" stroke="#0052CC" stroke-width="1.5"/><text x="905.0" y="705" font-size="17" font-style="italic" text-anchor="middle" dominant-baseline="middle">«module»</text><text x="905.0" y="724" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="middle">DescriptionParser</text><text x="648" y="789.0" font-size="18" dominant-baseline="middle">+adfLines(adf): string[]</text><text x="648" y="815.0" font-size="18" dominant-baseline="middle">+splitDescription(adf)</text><text x="648" y="841.0" font-size="18" dominant-baseline="middle">+mapPriority(name)</text><rect x="30" y="680" width="270" height="176" fill="#ECECFF" stroke="#9370DB" stroke-width="2"/><line x1="30" y1="710" x2="300" y2="710" stroke="#9370DB" stroke-width="1.5"/><line x1="30" y1="744" x2="300" y2="744" stroke="#9370DB" stroke-width="1.5"/><text x="165.0" y="6