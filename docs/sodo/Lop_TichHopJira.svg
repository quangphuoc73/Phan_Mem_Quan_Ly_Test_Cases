đọc / ghi</text><text x="600.0" y="1175.0" font-size="16" font-style="italic" text-anchor="middle" dominant-baseline="middle">Không có API tạo, sửa, xóa requirement: mọi thay đổi đến từ Jira; mỗi lần nội dung đổi tạo một phiên bản mới.</text></svg>
