<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" width="1150" height="600" font-family="Times New Roman, Times, serif"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="26" font-weight="bold" dominant-baseline="middle">Sơ đồ trạng thái của Test Run (đợt kiểm thử)</text><circle cx="215" cy="95" r="14" fill="#000"/><rect x="60" y="150" width="310" height="120" rx="10" fill="#ECECFF" stroke="#9370DB" stroke-width="2"/><text x="215.0" y="187.2" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Đang mở – chưa có kết quả</text><text x="215.0" y="210.0" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">sửa được build, môi trường;</text><text x="215.0" y="232.8" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">thêm, bỏ test; phân công</text><rect x="420" y="150" width="310" height="120" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="575.0" y="187.2" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Đang mở – đã có kết quả</text><text x="575.0" y="210.0" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">build, môi trường cố định;</text><text x="575.0" y="232.8" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">chỉ bỏ test chưa có kết quả</text><rect x="780" y="150" width="310" height="120" rx="10" fill="#F5F5F5" stroke="#757575" stroke-width="2"/><text x="935.0" y="187.2" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Đã đóng</text><text x="935.0" y="210.0" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">không ghi thêm kết quả;</text><text x="935.0" y="232.8" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">test chưa chạy tính chưa chạy</text><circle cx="935" cy="360" r="14" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="935" cy="360" r="9" fill="#000"/><polyline points="215.0,109.0 215.0,137.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="215.0,150.0 208.0,137.0 222.0,137.0" fill="#333333"/><rect x="114.2" y="108.8" width="72" height="26" fill="#fff" fill-opacity="0.92"/><text x="150.0" y="122.0" font-size="17" text-anchor="middle" dominant-baseline="middle">Lập đợt</text><polyline points="370.0,210.0 407.0,210.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="420.0,210.0 407.0,217.0 407.0,203.0" fill="#333333"/><rect x="337.2" y="101.6" width="106" height="47" fill="#fff" fill-opacity="0.92"/><text x="390.0" y="114.8" font-size="17" text-anchor="middle" dominant-baseline="middle">Ghi kết quả</text><text x="390.0" y="135.2" font-size="17" text-anchor="middle" dominant-baseline="middle">đầu tiên</text><polyline points="730.0,210.0 767.0,210.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="780.0,210.0 767.0,217.0 767.0,203.0" fill="#333333"/><rect x="668.0" y="78.2" width="164" height="64" fill="#fff" fill-opacity="0.92"/><text x="750.0" y="90.8" font-size="16" text-anchor="middle" dominant-baseline="middle">Đóng đợt</text><text x="750.0" y="110.0" font-size="16" text-anchor="middle" dominant-baseline="middle">[xác nhận nếu</text><text x="750.0" y="129.2" font-size="16" text-anchor="middle" dominant-baseline="middle">còn test chưa chạy]</text><polyline points="215.0,270.0 215.0,330.0 840.0,330.0 840.0,283.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="840.0,270.0 847.0,283.0 833.0,283.0" fill="#333333"/><rect x="433.2" y="300.8" width="174" height="26" fill="#fff" fill-opacity="0.92"/><text x="520.0" y="314.0" font-size="17" text-anchor="middle" dominant-baseline="middle">Đóng đợt [xác nhận]</text><polyline points="575.0,270.0 575.0,300.0 635.0,300.0 635.0,283.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="635.0,270.0 642.0,283.0 628.0,283.0" fill="#333333"/><text x="696.0" y="290.0" font-size="16" font-style="italic" text-anchor="start" dominant-baseline="middle">Ghi thêm kết quả</text><polyline points="935.0,270.0 935.0,333.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="935.0,346.0 928.0,333.0 942.0,333.0" fill="#333333"/><path d="M60,420 h1014 l16,16 v64 h-1030 z" fill="#FFFDE7" stroke="#BDB76B" stroke-width="1.5"/><path d="M1074,420 v16 h16" fill="none" stroke="#BDB76B" stroke-width="1.5"/><text x="70" y="449.2" font-size="18" dominant-baseline="middle">Muốn chạy build hoặc môi trường khác thì lập đợt mới (D3). Requirement đổi, lưu trữ hoặc Cần kiểm tra</text><text x="70" y="470.8" font-size="18" dominant-baseline="middle">khi đợt đang mở thì đợt vẫn chạy phiên bản test đã cố định và hiện cảnh báo (QĐ14).</text></svg>
