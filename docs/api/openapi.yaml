        '200': { description: Đã sửa, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /audit-logs:
    get:
      tags: [YC10, YC11, YC12 – Quản trị]
      summary: Nhật ký hoạt động (300 dòng gần nhất) – Admin, QA Lead
      operationId: listAuditLogs
      responses:
        '200': { description: Nhật ký, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /ai-logs:
    get:
      tags: [YC10, YC11, YC12 – Quản trị]
      summary: Nhật ký gọi AI (prompt đã che dữ liệu) – Admin, QA Lead, Tester
