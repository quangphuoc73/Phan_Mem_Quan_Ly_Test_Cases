      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { base_url: { type: string, format: uri } } }
      responses:
        '200': { description: Đã lưu, content: { application/json: { schema: { type: object } } } }
  /testcases/{id}/script:
    get:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC19 – script Playwright của test case
      operationId: getScript
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Script hoặc null, content: { application/json: { schema: { type: [object, 'null'] } } } }
    put:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC19 – sửa script
      operationId: saveScript
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { code: { type: string } } }
      responses:
        '200': { description: Script, content: { application/json: { schema: { type: object } } } }
  /testcases/{id}/script/generate:
    post:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC19 – AI sinh script cho test Đã duyệt
      operationId: generateScript
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Script, content: { application/json: { schema: { type: object } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /testcases/{id}/script/run:
    post:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC19 – chạy script, ghi kết quả vào một test trong Test Run (QĐ5)
      operationId: runScript
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [run_id, item_id], properties: { run_id: { type: integer }, item_id: { type: integer } } }
      responses:
        '200': { description: Kết quả chạy, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /testcases/{id}/script/download:
    get:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC19 – tải file .spec.js
      operationId: downloadScript
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: File script, content: { text/javascript: { schema: { type: string } } } }
  /projects/{id}/sprints:
    get:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC20 – sprint của dự án kèm velocity, Definition of Done
      operationId: listSprints
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Danh sách sprint, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /sprints/{id}/burndown:
    get:
      tags: [Ngoài MVP (bật bằng cờ)]
      summary: YC20 – burndown của sprint
      operationId: sprintBurndown
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Burndown, content: { application/json: { schema: { type: object } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: integer } }
    ProjectId: { name: project_id, in: query, schema: { type: integer } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Chưa đăng nhập hoặc sai thông tin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Vai trò không có quyền, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Không tìm thấy, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Vi phạm quy định nghiệp vụ (QĐ), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: Vượt giới hạn gọi AI mỗi giờ (QĐ2), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AiError: { description: AI không trả kết quả hợp lệ sau khi thử lại, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: { type: object }
    Role: { type: string, enum: [ADMIN, QA_LEAD, PO_BA, TESTER, DEVELOPER] }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        full_name: { type: string }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: integer }
    Requirement:
      type: object
      description: BM1 – requirement đồng bộ từ Jira
      properties:
        id: { type: integer }
        jira_issue_id: { type: [string, 'null'], description: '[1.1] định danh không đổi' }
        code: { type: string, description: Mã hiển thị, VD SHOP-5 }
        project_id: { type: integer }
        issue_type: { type: string }
        title: { type: string }
        description: { type: string }
        acs: { type: array, items: { type: string } }
        priority: { type: string, enum: [High, Medium, Low] }
        jira_status: { type: [string, 'null'] }
        jira_updated_at: { type: [string, 'null'], format: date-time }
        current_version: { type: integer }
        sync_state: { type: string, enum: [NORMAL, MISSING_AC, NEEDS_CHECK, ARCHIVED] }
        check_reason: { type: [string, 'null'], enum: [NOT_FOUND, TYPE_EXCLUDED, null] }
        check_kept_by: { type: [integer, 'null'] }
        tc_needs_review: { type: integer }
        proposals_pending: { type: integer }
    RequirementVersion:
      type: object
      properties:
        version: { type: integer }
        title: { type: string }
        description: { type: string }
        acs: { type: array, items: { type: string } }
        source: { type: string, enum: [IMPORT, WEBHOOK, SCHEDULE, MANUAL, SEED] }
        changes:
          type: [object, 'null']
          properties:
            title: { type: boolean }
            description: { type: boolean }
            ac_added: { type: array, items: { type: string } }
            ac_removed: { type: array, items: { type: string } }
        created_at: { type: string }
    TestCaseStatus: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, RETURNED] }
    TestCaseContent:
      type: object
      description: Nội dung BM2
      required: [title, steps, expected_result, priority, type]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        precondition: { type: string, maxLength: 500 }
        steps: { type: array, items: { type: string }, minItems: 1, maxItems: 15 }
        expected_result: { type: string }
        priority: { type: string, enum: [High, Medium, Low] }
        type: { type: string, enum: [Positive, Negative, Edge] }
    TestCase:
      allOf:
        - { $ref: '#/components/schemas/TestCaseContent' }
        - type: object
          properties:
            id: { type: integer }
            code: { type: string, description: '<mã requirement>-TCnn' }
            story_id: { type: integer }
            status: { $ref: '#/components/schemas/TestCaseStatus' }
            source: { type: string, enum: [AI, MANUAL] }
            version: { type: integer }
            req_version: { type: integer, description: Phiên bản requirement đã liên kết }
            acs: { type: array, items: { type: string } }
            needs_review: { type: boolean }
            review_reason: { type: [string, 'null'], enum: [AC_CHANGED, AC_REMOVED, CONTENT_CHANGED, null] }
            needs_retest: { type: boolean }
            proposal_id: { type: [integer, 'null'] }
            last_result: { type: [string, 'null'], enum: [PASS, FAIL, BLOCKED, null] }
    Suite:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        name: { type: string }
        description: { type: string }
        tc_count: { type: integer }
        items: { type: array, items: { type: object } }
    RunInput:
      type: object
      required: [project_id, name, build, environment]
      properties:
        project_id: { type: integer }
        name: { type: string }
        run_type: { type: string, enum: [NORMAL, RETEST, REGRESSION], default: NORMAL }
        build: { type: string, maxLength: 50 }
        environment: { type: string, maxLength: 100 }
        due_date: { type: string, format: date }
        suite_id: { type: integer }
        test_case_ids: { type: array, items: { type: integer } }
        assignee_id: { type: integer }
    Skipped:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        reason: { type: string }
    TestRun:
      type: object
      description: BM13 – đợt kiểm thử
      properties:
        id: { type: integer }
        project_id: { type: integer }
        name: { type: string }
        run_type: { type: string, enum: [NORMAL, RETEST, REGRESSION] }
        build: { type: string }
        environment: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        locked: { type: boolean, description: Đã có kết quả nên build, môi trường cố định }
        progress:
          type: object
          properties:
            total: { type: integer }
            executed: { type: integer }
            percent: { type: number }
        items: { type: array, items: { type: object } }
    Execution:
      type: object
      description: BM4 – một lần ghi kết quả
      properties:
        id: { type: integer }
        run_id: { type: integer }
        test_case_id: { type: integer }
        tc_version: { type: integer }
        result: { type: string, enum: [PASS, FAIL, BLOCKED] }
        note: { type: [string, 'null'] }
        defect_code: { type: [string, 'null'] }
        evidence_url: { type: [string, 'null'] }
        retest_of: { type: [integer, 'null'], description: '[3.1] lần Fail gốc' }
        executed_by: { type: integer }
        executed_at: { type: string }
    FixReport:
      type: object
      description: BM17 – phiếu báo đã sửa lỗi
      properties:
        id: { type: integer }
        execution_id: { type: integer }
        build: { type: string }
        status: { type: string, enum: [WAITING, CLOSED, REOPENED] }
        retest_in_same_run: { type: boolean }
    ImpactAnalysis:
      type: object
      description: BM14 – một lần phân tích ảnh hưởng
      properties:
        id: { type: integer }
        story_id: { type: integer }
        from_version: { type: integer }
        to_version: { type: integer }
        proposals: { type: array, items: { $ref: '#/components/schemas/Proposal' } }
    Proposal:
      type: object
      description: BM14, BM15 – đề xuất AI
      properties:
        id: { type: integer }
        type: { type: string, enum: [UPDATE, MISSING, RERUN, CLARIFY] }
        test_case_id: { type: [integer, 'null'] }
        source_part: { type: string, enum: [AC, TITLE, DESCRIPTION] }
        source_ac: { type: [string, 'null'] }
        reason: { type: string }
        content: { type: [object, 'null'], description: Nội dung test đề xuất (Cần sửa, Còn thiếu) }
        before: { type: [object, 'null'], description: Nội dung test hiện tại }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, OUTDATED] }
        note: { type: [string, 'null'] }
        result_test_case_id: { type: [integer, 'null'] }
    RegressionSet:
      type: object
      description: BM16 – bộ regression
      properties:
        id: { type: integer }
        story_id: { type: integer }
        from_version: { type: integer }
        to_version: { type: integer }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        aiAvailable: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              test_case_id: { type: integer }
              priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
              reason: { type: string }
              origin: { type: string, enum: [LINKED, AI, PROPOSAL, MANUAL] }
              mandatory: { type: boolean }
              removed: { type: boolean }
              blocked_reason: { type: [string, 'null'] }
        blocked: { type: array, items: { type: object } }
        run_id: { type: [integer, 'null'] }
    SyncResult:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        modules: { type: integer }
        members: { type: integer }
        unmapped: { type: array, items: { type: string } }
        stories:
          type: object
          properties:
            created: { type: integer }
            updated: { type: integer }
            versioned: { type: integer }
            flaggedTests: { type: integer }
            skippedOlder: { type: integer }
            needsCheck: { type: integer }
            restored: { type: integer }
            missingCriteria: { type: integer }
        warnings: { type: array, items: { type: string } }
    Report:
      type: object
      description: BM5 – báo cáo kiểm thử
      properties:
        scope: { type: object }
        stories: { type: integer }
        inScope: { type: integer }
        executed: { type: integer }
        notRun: { type: integer }
        runs: { type: object, properties: { PASS: { type: integer }, FAIL: { type: integer }, BLOCKED: { type: integer } } }
        passRate: { type: number }
        executionProgress: { type: number }
        coverage: { type: number, description: Bao phủ story (mẫu số không gồm story Thiếu AC) }
        acCoverage: { type: number }
        uncovered: { type: array, items: { type: object } }
        uncoveredAcs: { type: array, items: { type: object } }
        missingAc: { type: array, items: { type: object } }
        needsReview: { type: integer }
        needsRetest: { type: integer }
        proposals: { type: object }
        byModule: { type: array, items: { type: object } }
        trend: { type: array, items: { type: object } }
        ai: { type: object }
