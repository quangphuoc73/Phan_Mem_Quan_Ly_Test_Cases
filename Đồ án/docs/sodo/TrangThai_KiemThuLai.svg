<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="1150" height="640" font-family="Times New Roman, Times, serif"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="26" font-weight="bold" dominant-baseline="middle">Sơ đồ trạng thái kiểm thử lại sau khi báo sửa lỗi (YC18)</text><circle cx="210" cy="95" r="14" fill="#000"/><rect x="60" y="150" width="300" height="100" rx="10" fill="#FDECEA" stroke="#E53935" stroke-width="2"/><text x="210.0" y="188.6" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Lần chạy Fail</text><text x="210.0" y="211.4" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">trong một Test Run</text><rect x="430" y="150" width="300" height="100" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="580.0" y="188.6" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Chờ kiểm thử lại</text><text x="580.0" y="211.4" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">WAITING</text><rect x="800" y="150" width="300" height="100" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="950.0" y="188.6" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Đã đóng</text><text x="950.0" y="211.4" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">CLOSED</text><rect x="430" y="380" width="300" height="100" rx="10" fill="#FDECEA" stroke="#E53935" stroke-width="2"/><text x="580.0" y="418.6" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">Mở lại</text><text x="580.0" y="441.4" font-size="19" fill="#000" text-anchor="middle" dominant-baseline="middle">REOPENED</text><circle cx="950" cy="330" r="14" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="950" cy="330" r="9" fill="#000"/><polyline points="210.0,109.0 210.0,137.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="210.0,150.0 203.0,137.0 217.0,137.0" fill="#333333"/><polyline points="360.0,200.0 417.0,200.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="430.0,200.0 417.0,207.0 417.0,193.0" fill="#333333"/><rect x="333.0" y="97.8" width="124" height="44" fill="#fff" fill-opacity="0.92"/><text x="395.0" y="110.4" font-size="16" text-anchor="middle" dominant-baseline="middle">Developer báo</text><text x="395.0" y="129.6" font-size="16" text-anchor="middle" dominant-baseline="middle">đã sửa (build)</text><polyline points="730.0,200.0 787.0,200.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="800.0,200.0 787.0,207.0 787.0,193.0" fill="#333333"/><rect x="703.0" y="209.4" width="124" height="25" fill="#fff" fill-opacity="0.92"/><text x="765.0" y="222.0" font-size="16" text-anchor="middle" dominant-baseline="middle">Chạy lại: Pass</text><polyline points="580.0,250.0 580.0,367.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="580.0,380.0 573.0,367.0 587.0,367.0" fill="#333333"/><rect x="598.0" y="302.4" width="124" height="25" fill="#fff" fill-opacity="0.92"/><text x="660.0" y="315.0" font-size="16" text-anchor="middle" dominant-baseline="middle">Chạy lại: Fail</text><polyline points="730.0,175.0 765.0,175.0 765.0,120.0 680.0,120.0 680.0,137.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="680.0,150.0 673.0,137.0 687.0,137.0" fill="#333333"/><text x="720.0" y="102.0" font-size="16" font-style="italic" text-anchor="middle" dominant-baseline="middle">Chạy lại: Blocked (vẫn chờ)</text><polyline points="430.0,430.0 210.0,430.0 210.0,263.0" fill="none" stroke="#333333" stroke-width="2"/><polygon points="210.0,250.0 217.0,263.0 203.0,263.0" fill="#333333"/><rect x="234.0" y="387.8" width="132" height="44" fill="#fff" fill-opacity="0.92"/><text x="300.0" y="400.4" font-size="16" text-anchor="middle" dominant-baseline="middle">lần Fail mới,</text><text x="300.0" y="419.6" font-size="16"